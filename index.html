<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baduriya Media Portal</title>
<meta name="theme-color" content="#800000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Baduriya Media">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>window.BMP_HOSTED=true;if('serviceWorker' in navigator)addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Tamil:wdth,wght@75..100,400..800&family=Bebas+Neue&family=Mukta+Malar:wght@400;500;600;700&family=Oswald:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   BADURIYA MEDIA PORTAL — UI styles
   Brand: maroon #800000 + white, ash greys. No blue anywhere.
   ========================================================= */
:root{
  --m:#800000; --m2:#5e0000; --m-soft:#f7ecec; --m-line:#e8cfcf;
  --ink:#262626; --ash:#6b6b6b; --ash2:#a3a3a3; --line:#e4e1de;
  --bg:#f4f2f0; --card:#ffffff; --gold:#c99a00; --green:#2e8b57;
  --r:16px; --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 24px rgba(60,0,0,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{accent-color:var(--m)}
::selection{background:var(--m);color:#fff}
:focus{outline:none}
:focus-visible{outline:2px solid var(--m);outline-offset:2px}
body{margin:0;font-family:Poppins,'Mukta Malar',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
a{color:var(--m)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--ink)}
.ta{font-family:'Mukta Malar',Poppins,sans-serif}
.hidden{display:none!important}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line)}
.top-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand img{height:42px;width:auto}
.brand b{display:block;font-family:Oswald,sans-serif;font-weight:600;font-size:19px;letter-spacing:.02em;color:var(--m);line-height:1.1;white-space:nowrap}
.brand small{display:block;color:var(--ash);font-size:12px;white-space:nowrap}
.stripe{height:4px;background:linear-gradient(90deg,var(--ash2) 0 55%,var(--m) 55% 100%)}
.tbtn{display:flex;align-items:center;gap:6px;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:500;font-size:14px;min-height:42px}
.tbtn:hover{border-color:var(--m-line);background:var(--m-soft)}
.tbtn svg{width:19px;height:19px;stroke:var(--m)}
.tbtn.unlocked{background:var(--m);color:#fff;border-color:var(--m)}
.tbtn.unlocked svg{stroke:#fff}
@media(max-width:560px){.tbtn span{display:none}.brand small{display:none}.brand b{font-size:16px}.brand .full{display:none}}
@media(min-width:561px){.brand .short{display:none}}
.back svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:979px){body.pane-ex .pv-bar,body.pane-ex .pv-note{display:none}}

/* ---------- home ---------- */
.wrap{max-width:1320px;margin:0 auto;padding:18px 16px 40px}
.hero{background:linear-gradient(120deg,#800000 0%,#5e0000 100%);color:#fff;border-radius:22px;padding:26px 22px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero:before,.hero:after{content:"";position:absolute;background:rgba(255,255,255,.06);transform:skewX(-28deg)}
.hero:before{width:180px;top:0;bottom:0;right:120px}
.hero:after{width:70px;top:0;bottom:0;right:40px;background:rgba(255,255,255,.09)}
.hero h1{margin:0;font-family:Oswald,sans-serif;font-weight:600;font-size:28px;letter-spacing:.01em;position:relative}
.hero p{margin:6px 0 0;opacity:.9;position:relative;max-width:620px}
.hero .ta{opacity:.8;font-size:14px}
.group{margin-top:26px}
.group h2{font-family:Oswald,sans-serif;font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--ash);margin:0 0 10px;display:flex;align-items:center;gap:10px}
.group h2:after{content:"";flex:1;height:1px;background:var(--line)}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:760px){.cards{grid-template-columns:repeat(4,1fr)}}
.tcard{position:relative;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 14px 14px;display:flex;flex-direction:column;gap:6px;min-height:132px;transition:transform .15s,box-shadow .15s,border-color .15s}
.tcard:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--m-line)}
.tcard .ic{width:44px;height:44px;border-radius:12px;background:var(--m-soft);display:grid;place-items:center}
.tcard .ic svg{width:24px;height:24px;stroke:var(--m);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tcard b{font-weight:600;font-size:15px;line-height:1.25}
.tcard small{color:var(--ash);font-size:12.5px;line-height:1.3}
.tcard .badge{position:absolute;top:12px;right:12px;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:#efedeb;color:var(--ash)}
.tcard.ready .badge{background:var(--m);color:#fff}
.tcard.soon{opacity:.62}
.tcard.soon:hover{transform:none;box-shadow:none;border-color:var(--line)}
.drafts-row{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.dcard{flex:0 0 150px;scroll-snap-align:start;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;position:relative}
.dcard img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#eee}
.dcard div{padding:8px 10px}
.dcard b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcard small{color:var(--ash);font-size:11.5px}
.dcard .x{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:16px;line-height:28px;text-align:center}

/* ---------- editor ---------- */
.ehead{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.back{display:flex;align-items:center;gap:6px;padding:8px 12px 8px 8px;border-radius:12px;font-weight:500;color:var(--m)}
.back:hover{background:var(--m-soft)}
.ehead h1{margin:0;font-family:Oswald,sans-serif;font-weight:600;font-size:21px;flex:1;min-width:180px}
.saved{font-size:12.5px;color:var(--ash);display:flex;align-items:center;gap:6px}
.saved i{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}
.saved.busy i{background:var(--gold)}
.editor{display:block}
.pane{display:none}
.pane.on{display:block}
@media(min-width:980px){
  .editor{display:grid;grid-template-columns:minmax(380px,440px) 1fr;gap:22px;align-items:start}
  .pane{display:block!important}
  .right{position:sticky;top:84px}
  .mnav{display:none!important}
}
.right{display:flex;flex-direction:column;gap:14px}
.sec{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.sec h3{margin:0 0 12px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:10px}
.sec h3 .n{width:26px;height:26px;border-radius:50%;background:var(--m);color:#fff;font-size:13px;display:grid;place-items:center;flex:0 0 26px}
.sec.fine{border-color:var(--m-line);background:linear-gradient(#fff,#fffafa)}
.sec .note{font-size:12.5px;color:var(--ash);margin:-4px 0 12px}
.fld{margin-bottom:12px}
.fld:last-child{margin-bottom:0}
.fld label{display:block;font-size:13px;font-weight:600;margin-bottom:5px;color:#3a3a3a}
.fld label em{font-style:normal;font-weight:400;color:var(--ash)}
.fld .help{font-size:12px;color:var(--ash);margin-top:4px}
.inp{width:100%;font-size:16px;padding:11px 12px;border:1.5px solid #dcd8d4;border-radius:11px;background:#fff;min-height:46px;transition:border-color .15s,box-shadow .15s}
textarea.inp{min-height:84px;resize:vertical;line-height:1.4}
.inp:focus{border-color:var(--m);box-shadow:0 0 0 3px rgba(128,0,0,.12)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:#f1efed;border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-size:14px;font-weight:500;min-height:40px;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:#fff;color:var(--m);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.sw{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.2);display:inline-block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:12px;font-weight:600;font-size:15px;min-height:46px;border:1.5px solid transparent;transition:background .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--m);color:#fff}
.btn.pri:hover{background:var(--m2)}
.btn.out{border-color:var(--m-line);color:var(--m);background:#fff}
.btn.out:hover{background:var(--m-soft)}
.btn.soft{background:#f1efed;color:var(--ink)}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:7px 12px;font-size:13.5px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.photo{display:flex;gap:12px;align-items:center}
.photo .th{width:76px;height:76px;border-radius:12px;background:#f1efed center/cover no-repeat;flex:0 0 76px;display:grid;place-items:center;color:var(--ash2);border:1.5px dashed #d6d2ce;overflow:hidden}
.photo .th.has{border:1px solid var(--line);background-color:#eceae8}
.photo .th.cut{background-size:contain;background-position:center bottom;background-image:linear-gradient(#f5f5f5,#dcdcdc)}
.photo .th svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.6}
.photo .act{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:99px;background:#eef6f1;color:#23704a;margin-top:6px}
.tag.grey{background:#f0eeec;color:var(--ash)}
.students{display:flex;flex-direction:column;gap:10px}
.stu{border:1px solid var(--line);border-radius:14px;padding:10px;background:#fcfbfa}
.stu-top{display:flex;gap:10px;align-items:flex-start}
.stu .th{width:64px;height:64px;flex:0 0 64px;border-radius:10px;background:#f1efed center/cover no-repeat;border:1.5px dashed #d6d2ce;display:grid;place-items:center;color:var(--ash2)}
.stu .th.has{border:1px solid var(--line)}
.stu .th.cut{background-size:contain;background-position:center bottom;background-image:linear-gradient(#f5f5f5,#dcdcdc)}
.stu .th svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6}
.stu .grid{flex:1;display:grid;grid-template-columns:1fr 84px;gap:8px}
.stu .grid .inp{min-height:42px;padding:8px 10px;font-size:15px}
.stu .grid .full{grid-column:1/-1}
.stu .tools{display:flex;gap:4px;justify-content:flex-end;margin-top:8px}
.ibtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ash)}
.ibtn:hover{background:#f1efed;color:var(--m)}
.ibtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.num{font-family:Oswald,sans-serif;font-weight:600;color:var(--m);font-size:13px;margin-right:auto;align-self:center;padding-left:4px}

/* preview */
.pv{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px}
.cv-wrap{position:relative;border-radius:10px;overflow:hidden;background:repeating-conic-gradient(#f3f3f3 0 25%,#fff 0 50%) 0 0/20px 20px;box-shadow:0 4px 30px rgba(0,0,0,.08)}
#cv{display:block;width:100%;height:auto}
.cv-wrap.tall{max-width:min(420px,100%);margin:0 auto}
.pv-fmt{margin-bottom:10px}
.pv-fmt .seg{max-width:360px;margin:0 auto}
@media(min-width:980px){.cv-wrap{max-width:min(620px,calc(100vh - 300px));margin:0 auto}.cv-wrap.tall{max-width:min(420px,calc((100vh - 300px) * .5625))}}
.pv-bar{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.pv-bar .btn{flex:1}
.pv-note{font-size:12px;color:var(--ash);text-align:center;margin-top:8px}
.exp h3{margin:0 0 12px}
.exp .fld{margin-bottom:12px}
.caption{width:100%;min-height:120px;font-size:13.5px}

/* mobile nav */
.mnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.mnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;font-size:12px;font-weight:500;color:var(--ash)}
.mnav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mnav button.on{color:var(--m);background:var(--m-soft);font-weight:600}
body.editing{padding-bottom:84px}
@media(min-width:980px){body.editing{padding-bottom:0}}

/* modal + toast */
.ov{position:fixed;inset:0;background:rgba(30,0,0,.45);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fd .15s}
@media(min-width:700px){.ov{align-items:center}}
.dlg{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px;animation:up .2s ease-out}
@media(min-width:700px){.dlg{border-radius:20px}}
.dlg h2{margin:0 0 8px;font-family:Oswald,sans-serif;font-weight:600;font-size:21px}
.dlg p{margin:0 0 12px;color:#444}
.dlg .acts{display:flex;gap:10px;margin-top:16px}
.dlg .acts .btn{flex:1}
@keyframes fd{from{opacity:0}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#2a2a2a;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;z-index:200;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:90vw;text-align:center;animation:up .2s}
@media(min-width:980px){.toast{bottom:30px}}
.crop-cv{display:block;margin:0 auto;border-radius:12px;touch-action:none;cursor:grab;background:#eee;max-width:100%}
.range{width:100%}
.lockinfo{display:flex;gap:12px;align-items:flex-start;background:var(--m-soft);border-radius:14px;padding:12px;margin-bottom:14px;font-size:13.5px}
.lockinfo svg{width:22px;height:22px;flex:0 0 22px;stroke:var(--m);fill:none;stroke-width:2}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;min-height:40px}
.chk input{width:20px;height:20px}
@media(min-width:980px){.mnext{display:none!important}}

/* background removal switch */
.bgbar{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--m-line);border-radius:16px;padding:12px 14px;margin-bottom:14px;box-shadow:var(--shadow)}
.bgbar .bic{width:42px;height:42px;border-radius:12px;background:var(--m);display:grid;place-items:center;flex:0 0 42px}
.bgbar .bic svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bgbar b{display:block;font-size:15px}
.bgbar small{display:block;color:var(--ash);font-size:12.5px;line-height:1.3}
.onoff{font-family:Oswald,sans-serif;font-size:14px;letter-spacing:.06em;color:var(--ash)}
.onoff.on{color:var(--m)}
.switch{position:relative;width:56px;height:32px;border-radius:99px;background:#d6d1cc;transition:background .2s;flex:0 0 56px}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.switch.on{background:var(--m)}
.switch.on:after{left:27px}
/* import preview table */
.imp-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin:6px 0 10px}
table.imp{border-collapse:collapse;width:100%;font-size:13px}
table.imp th{background:#f6f3f0;padding:6px;min-width:120px}
table.imp th .inp{min-height:36px;padding:5px 8px;font-size:13px}
table.imp td{padding:6px 8px;border-top:1px solid var(--line);white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.dlg{max-width:560px}
.spons{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp-th{position:relative;width:86px;height:56px;border-radius:10px;border:1px solid var(--line);background:#fff center/contain no-repeat;background-origin:content-box;padding:6px}
.sp-th .x{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;background:#333;color:#fff;font-size:14px;line-height:24px;text-align:center}
.sp-add{height:56px;padding:0 14px;border-radius:10px;border:1.5px dashed #d0cbc6;color:var(--m);font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:6px}
.sp-add svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.mtile{border:1px solid var(--line);border-radius:12px;padding:6px;background:#fcfbfa}
.mimg{position:relative;aspect-ratio:1;border-radius:8px;background:#eee center/cover no-repeat}
.vbadge{position:absolute;left:6px;bottom:6px;background:rgba(128,0,0,.9);color:#fff;font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px}
.cbadge{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.6);color:#fff;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:99px}
.th{position:relative}
.th .vbadge{left:4px;bottom:4px;font-size:10px}
.mcap{min-height:36px!important;padding:6px 8px!important;font-size:13px!important;margin-top:6px}
.mtools{display:flex;justify-content:flex-end;gap:2px;margin-top:4px}
.mtools .ibtn{width:30px;height:30px}
.house-row{display:grid;grid-template-columns:46px 1fr 96px 36px;gap:8px;align-items:center;margin-bottom:8px}
.colorin{width:46px;height:46px;border:1.5px solid #dcd8d4;border-radius:11px;padding:3px;background:#fff}
.sec .note{font-size:12.5px;color:var(--ash);margin:-4px 0 12px}
.progress{height:6px;border-radius:99px;background:#eee;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:var(--m);width:0;transition:width .2s}

/* custom post builder */
.blk{border:1px solid var(--line);border-radius:14px;padding:10px 10px 12px;background:#fcfbfa;margin-bottom:10px}
.blk-h{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.blk-h b{flex:1;font-size:14px}
.blk-ic{width:30px;height:30px;border-radius:9px;background:#800000;color:#fff;display:grid;place-items:center;flex:0 0 30px}
.blk-ic svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8}
.blk-add{border:1.5px dashed #d6d2ce;border-radius:14px;padding:10px}
.blk-add small{display:block;color:var(--ash);margin-bottom:8px}
.blk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px}
.blk-btn{display:flex;align-items:center;gap:7px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:500;text-align:left;min-height:42px}
.blk-btn:hover{border-color:#800000;color:#800000}
.blk-btn svg{width:17px;height:17px;flex:0 0 17px;stroke:currentColor;fill:none;stroke-width:1.7}
.tcard.mine{border-style:dashed}
.tcard .x{position:absolute;bottom:8px;right:8px;z-index:2;width:28px;height:28px;border-radius:50%;background:#f3f1ef;color:var(--ash);font-size:18px;line-height:28px;text-align:center}

.tbtn[hidden]{display:none}
#installBtn{background:#800000;color:#fff;border-color:#800000}
#installBtn svg{stroke:#fff}
.review-box{background:#faf8f6;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;white-space:pre-wrap;max-height:180px;overflow:auto;color:var(--ink)}
.steps-ios{margin:8px 0 0;padding-left:20px;line-height:1.7}
.offline-pill{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#3a3a3a;color:#fff;font-size:13px;padding:6px 14px;border-radius:20px;z-index:60}

/* label photos (bulk) */
.lab{display:block}
@media(min-width:900px){.lab{display:grid;grid-template-columns:minmax(360px,420px) 1fr;column-gap:22px;align-items:start;grid-auto-rows:min-content}.lab>.sec{grid-column:1}.lab>.lab-main{grid-column:2;grid-row:1 / span 4}}
.lab-main{margin-bottom:12px}
.lab-main{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;min-height:300px}
.lab-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.lab-count{color:var(--ash)}
.lab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;align-items:start}
.lab-card{border:1px solid var(--line);border-radius:14px;padding:8px;background:#fcfbfa}
.lab-pic{background:#eceae8;border-radius:8px;overflow:hidden;display:grid;place-items:center}
.lab-pic canvas{display:block;max-width:100%;max-height:300px;width:auto;height:auto}
.lab-card .inp{margin-top:8px;min-height:40px;padding:8px 10px;font-size:14px}
.lab-card .inp.lab-desc{margin-top:6px;min-height:36px;font-size:13px}
.lab-tools{display:flex;align-items:center;gap:4px;margin-top:6px}
.lab-tools small{flex:1;color:var(--ash2);font-size:11px}
.lab-empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:60px 20px;color:var(--ash);text-align:center}
.lab-empty svg{width:42px;height:42px;stroke:#800000;fill:none;stroke-width:1.5}
.lab-empty b{color:var(--ink);font-size:17px}
@media(max-width:560px){.lab-grid{grid-template-columns:repeat(2,1fr);gap:10px}.lab-main{padding:10px}}

.lab-pic{position:relative;cursor:zoom-in}
.lab-zoom{position:absolute;right:6px;top:6px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.lab-zoom svg{width:16px;height:16px;stroke:#800000;fill:none;stroke-width:2}
.lb{position:fixed;inset:0;z-index:80;background:#1b1414;display:flex;flex-direction:column;color:#fff}
.lb-top{display:flex;align-items:center;gap:10px;padding:10px 14px}
.lb-info{flex:1;font-size:13px;color:#d9d4cc}
.lb-x{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:26px;line-height:42px;text-align:center}
.lb-stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:0 56px;touch-action:pan-y}
.lb-cv{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;box-shadow:0 10px 40px rgba(0,0,0,.5);border-radius:4px;background:#fff}
.lb-spin{position:absolute;top:12px;right:68px;width:22px;height:22px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:lbspin .8s linear infinite}
.lb-spin[hidden]{display:none}
@keyframes lbspin{to{transform:rotate(360deg)}}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center}
.lb-nav svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.4}
.lb-nav.prev{left:6px}.lb-nav.next{right:6px}.lb-nav.next svg{transform:rotate(180deg)}
.lb-bottom{padding:10px 14px 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;background:rgba(0,0,0,.25)}
.lb-fields{display:flex;gap:8px;flex:1 1 420px;max-width:720px}
.lb-fields .inp{flex:1;min-height:42px;background:#fff}
.lb-acts{display:flex;gap:8px;flex-wrap:wrap}
.lb .btn.out{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.lb .btn.out svg{stroke:#fff}
@media(max-width:600px){.lb-stage{padding:0 8px}.lb-nav{width:38px;height:38px;background:rgba(0,0,0,.35)}.lb-fields{flex-direction:column;flex-basis:100%}.lb-acts{width:100%;justify-content:center}}
</style>

  async all() { try { const r = await this.tx('readonly', s => s.getAll()); return (r || []).sort((a, b) => b.updated - a.updated); } catch (e) { return []; } },
  async put(d) { try { await this.tx('readwrite', s => s.put(d)); const all = await this.all(); for (const old of all.slice(MAX_DRAFTS)) await this.del(old.id); return true; } catch (e) { return false; } },

      const tc = document.createElement('canvas'); tc.width = Math.max(1, Math.round(iw * sc)); tc.height = Math.max(1, Math.round(ih * sc));
      const tx = tc.getContext('2d', { willReadFrequently: true }); tx.drawImage(im, 0, 0, tc.width, tc.height);
      let cut = false, bx0 = 0, by0 = 0, bx1 = iw, by1 = ih;

        }

        if (cut) { bx0 = Math.max(0, (minx - 1) / sc); by0 = Math.max(0, (miny - 1) / sc); bx1 = Math.min(iw, (maxx + 2) / sc); by1 = Math.min(ih, (maxy + 2) / sc); }

/** Lays out a vertical list of text items between y0 and y1, shrinking them

function flowItems(ctx, items, y0, y1, maxW, t, tStart, scale = 1) {
  const gap = 12;

  for (let pass = 0; pass < 12; pass++) {

      const text = it.up ? it.text.toUpperCase() : it.text;
      const mw = it.band ? maxW - 40 : maxW;
      const lay = fitRich(ctx, text, it.role, it.w, Math.max(it.w, 700), mw, 2, it.size * k, 11);
      const px = setFont(ctx, it.role, lay.size, it.w, text);
      return { it, text, lay, lh: px * 1.28, hh: lay.lines.length * px * 1.28 + (it.band ? 8 : 0) };

    ctx.restore();

function newStudent() { return { id: Math.random().toString(36).slice(2, 9), name: '', grade: '', place: '', placeCustom: '', event: '', photo: null }; }

function drawStudentCard(ctx, p, s, cx, top, cw, t, t0, th, env, ph, gal, k = 1, kind = 'pop', idx = 0) {
  const ta = p.lang === 'ta', st = S(p);
  const a = prog(t, t0, 0.7);
  if (a <= 0) return;
  ctx.save(); cardIn(ctx, kind, a, cx, top + cw * (0.3 + k * 0.5), idx);
  const x = cx - cw / 2;
  // place line + event line
  const pl = placeLabel(s.place, s.placeCustom, ta ? 'ta' : 'en');
  const md = placeOf(s.place).medal;
  let y = top;
  const psz = cw * 0.115;
  if (pl) {
    const tw = drawPlace(ctx, pl, cx + (md ? psz * 0.32 : 0), y + psz * 0.95, Math.min(psz, fitSize(ctx, pl, 'head', 600, cw * 0.86, psz, 9)), th.acc);
    if (md) { ctx.fillStyle = MEDAL[md]; ctx.beginPath(); ctx.arc(cx - tw / 2 - psz * 0.12, y + psz * 0.6, psz * 0.27, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1.5; ctx.stroke(); }
  } else if (env.preview && !s.name && !s.photo) { setFont(ctx, 'head', psz * 0.8, 600, 'x'); ctx.fillStyle = th.acc; ctx.globalAlpha *= 0.4; drawText(ctx, ta ? 'இடம்' : 'PLACE', cx, y + psz * 0.9, 'center'); ctx.globalAlpha /= 0.4; }
  y += psz * 1.12;
  const ev = s.event.trim();
  const esz = cw * 0.074;
  if (ev) { const e2 = ta ? ev : ev.toUpperCase(); const sz = fitSize(ctx, e2, 'head', 400, cw * 0.98, esz, 8, 0.02); setFont(ctx, 'head', sz, 400, e2); ctx.fillStyle = th.ink; drawText(ctx, e2, cx, y + esz * 0.95, 'center', sz * 0.02); }
  y += esz * 1.35;
  // photo box
  const box = { x, y, w: cw, h: cw * k };
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.16)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 6;
  rrect(ctx, box.x, box.y, box.w, box.h, cw * 0.06);
  const g = ctx.createLinearGradient(0, box.y, 0, box.y + box.h); g.addColorStop(0, th.card1); g.addColorStop(1, th.card2);
  ctx.fillStyle = p.theme === 'maroon' ? (() => { const g3 = ctx.createLinearGradient(0, box.y, 0, box.y + box.h); g3.addColorStop(0, '#ffffff'); g3.addColorStop(1, '#d9d9d9'); return g3; })() : g;
  ctx.fill(); ctx.restore();
  ctx.save(); rrect(ctx, box.x, box.y, box.w, box.h, cw * 0.06); ctx.clip();
  const img = s.photo && getImg(s.photo.src);
  if (img) drawPhoto(ctx, img, kenBurns(s.photo.cut ? { x: box.x, y: box.y + box.h * 0.04, w: box.w, h: box.h * 0.96 } : box, t, t0), s.photo, s.photo.cut ? 'contain' : 'cover', gal);
  else if (env.preview) drawSilhouette(ctx, { x: box.x + cw * 0.1, y: box.y + cw * 0.1, w: cw * 0.8, h: cw * 0.9 }, '#cfcfcf');
  // grade tag (vertical, right edge)
  const gr = cleanGrade(s.grade);

    const tag = st.gradeTag(gr), tw = cw * 0.13, tx = box.x + box.w - tw, ty = box.y + cw * 0.06, thh = cw * 0.52;
    ctx.fillStyle = th.acc === '#ffffff' ? '#800000' : th.acc; ctx.fillRect(tx, ty, tw, thh);
    ctx.save(); ctx.translate(tx + tw / 2, ty + thh / 2); ctx.rotate(Math.PI / 2);
    const sz = fitSize(ctx, tag, 'head', 600, thh * 0.88, tw * 0.62, 7, 0.06); setFont(ctx, 'head', sz, 600, tag);

    ctx.fillStyle = th.acc === '#ffffff' ? '#800000' : '#ffffff'; ctx.textBaseline = 'middle'; drawText(ctx, nm, cx, py + phh / 2 + 1, 'center', sz * 0.02);
    ctx.restore();
  }
  ctx.restore();
}

/* =====================================================================
   RENDER LOOP — preview canvas
   ===================================================================== */
let CV, CTX, renderQueued = false;
function requestRender() {
  if (renderQueued || APP.view !== 'editor') return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; if (!APP.anim) renderPreview(Infinity); });
}
function renderPreview(t, mainEnd) {
  if (!CV || !APP.project || APP.recording) return;   // the recorder owns the video clips while recording
  withFormat(APP.format, () => {
    if (CV.height !== H) { CV.height = H; CV.parentNode && CV.parentNode.classList.toggle('tall', H > W); }
    CTX.setTransform(1, 0, 0, 1, 0, 0); CTX.clearRect(0, 0, W, H);
    CTX.save(); TEMPLATES[APP.project.template].draw(CTX, APP.project, t, { preview: true }); CTX.restore();
    if (mainEnd && t > mainEnd) { CTX.save(); drawOutro(CTX, APP.project, t - mainEnd); CTX.restore(); }
  });
  endVideoFrame();
}
function playAnimation() {
  const tpl = TEMPLATES[APP.project.template];
  if (APP.anim) cancelAnimationFrame(APP.anim.raf);
  const main = durOf(tpl, APP.project) + 1.2, dur = main + OUTRO_LEN;
  const start = performance.now();
  const step = now => {
    const t = (now - start) / 1000;
    if (t > dur || APP.view !== 'editor') { APP.anim = null; renderPreview(Infinity); return; }
    renderPreview(t, main); APP.anim.raf = requestAnimationFrame(step);
  };
  APP.anim = { raf: requestAnimationFrame(step) };
}
/** render the finished poster to an offscreen canvas */
function renderPoster(p, scale = 1, fmt = 'square') {
  return withFormat(fmt, () => {
    const c = document.createElement('canvas'); c.width = W * scale; c.height = H * scale;
    const x = c.getContext('2d'); x.setTransform(scale, 0, 0, scale, 0, 0);
    TEMPLATES[p.template].draw(x, p, Infinity, { preview: false });
    return c;
  });
}

async function saveBlob(blob, filename) {
  if (DL) {
    try { await DL.save({ filename, data: blob }); return true; }
    catch (e) { if (e && e.code === 'declined') return false; }
  }
  const a = h('a', { href: URL.createObjectURL(blob), download: filename, style: { display: 'none' } });
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
  if (typeof offerShare === 'function') offerShare(blob, filename);
  return true;
}

/* ---------- crop / position dialog ---------- */
function cropDialog(photo, frame) {
  const img = getImg(photo.src); if (!img) return toast('Photo still loading…');
  const c0 = { ...photo.crop };
  const CW = Math.min(320, window.innerWidth - 80), CH = Math.round(CW / frame.aspect);
  const cv = h('canvas', { class: 'crop-cv', width: CW * 2, height: CH * 2, style: { width: CW + 'px', height: CH + 'px' } });
  const x = cv.getContext('2d');
  const box = { x: 0, y: 0, w: CW * 2, h: CH * 2 };
  const draw = () => {
    x.clearRect(0, 0, cv.width, cv.height);
    const g = x.createLinearGradient(0, 0, 0, cv.height); g.addColorStop(0, '#f6f6f6'); g.addColorStop(1, '#d6d6d6'); x.fillStyle = g; x.fillRect(0, 0, cv.width, cv.height);
    drawPhoto(x, img, box, photo, frame.mode, frame.align);
    x.strokeStyle = 'rgba(128,0,0,.35)'; x.lineWidth = 2;
    for (let i = 1; i < 3; i++) { x.beginPath(); x.moveTo(cv.width * i / 3, 0); x.lineTo(cv.width * i / 3, cv.height); x.moveTo(0, cv.height * i / 3); x.lineTo(cv.width, cv.height * i / 3); x.stroke(); }
    requestRender();
  };
  let drag = null;
  cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e => {
    if (!drag) return;
    photo.crop.x += (e.clientX - drag.x) / CW; photo.crop.y += (e.clientY - drag.y) / CH; drag = { x: e.clientX, y: e.clientY };
    if (frame.mode === 'cover') { const r = photoRect(img, box, photo, 'cover', frame.align); photo.crop.x += r.sx / box.w; photo.crop.y += r.sy / box.h; }
    draw();
  });
  cv.addEventListener('pointerup', () => drag = null);
  cv.addEventListener('pointercancel', () => drag = null);
  const zr = h('input', { type: 'range', class: 'range', min: frame.align && photo.face ? 0.6 : (frame.mode === 'cover' ? 1 : 0.5), max: 3, step: 0.01, value: photo.crop.z });
  zr.addEventListener('input', () => { photo.crop.z = parseFloat(zr.value); draw(); });
  const body = h('div', null, h('p', null, 'Drag the photo to move it. Use the slider to zoom.' + (frame.align && photo.face ? ' The face was found and lined up automatically.' : '')), cv, h('div', { class: 'fld', style: { marginTop: '14px' } }, h('label', null, 'Zoom'), zr));
  draw();
  modal('Adjust photo', body, [{ label: 'Reset', value: 'reset' }, { label: 'Done', value: 'ok', pri: true }]).then(v => {
    if (v === 'reset') { photo.crop = { z: 1, x: 0, y: 0 }; }
    if (APP.view === 'editor') buildForm($('#paneForm'));
    else if (v !== 'ok') { photo.crop = c0; }
    changed();
  });
}

/** left-aligned column of text blocks that shrinks together to fit */
function flowLeft(ctx, items, x, y0, y1, maxW, t, t0, scale = 1, opts = {}) {
  const C = opts.align === 'center', AL = C ? 'center' : 'left';
  items = items.filter(Boolean);
  let k = scale, L = [];
  for (let pass = 0; pass < 16; pass++) {
    L = items.map(it => {
      if (it.kind === 'gap') return { it, hh: it.h * k };
      if (it.kind === 'rule') return { it, hh: it.h };
      const text = it.up ? String(it.text).toUpperCase() : String(it.text);
      const pad = it.kind === 'chip' ? 30 : 0;
      if (it.sp != null) {
        const size = fitSize(ctx, text, it.role, it.w, maxW - pad, it.size * k, 8, it.sp);
        const px = setFont(ctx, it.role, size, it.w, text);
        return { it, text, single: true, size, px, lh: px * (it.lh || 1.2), hh: px * (it.lh || 1.2) };
      }
      const lay = fitRich(ctx, text, it.role, it.w, it.wB || Math.max(it.w, 700), maxW - pad, it.maxLines || 2, it.size * k, 8);
      const px = setFont(ctx, it.role, lay.size, it.w, text), lh = px * (it.lh || 1.25);
      const chipH = it.kind === 'chip' ? lh + px * 0.5 : lh;
      return { it, text, lay, px, lh, chipH, hh: lay.lines.length * chipH + (it.kind === 'chip' ? (lay.lines.length - 1) * 6 : 0) };
    });
    var total = L.reduce((s, l) => s + l.hh, 0) + Math.max(0, L.length - 1) * 12 * k;
    if (total <= y1 - y0 || k < 0.42) break;
    k *= 0.93;
  }
  if (opts.measure) return total;
  let y = opts.vcenter ? y0 + Math.max(0, (y1 - y0 - total) / 2) : y0;
  L.forEach((l, i) => {
    const it = l.it, a = EASE.out(prog(t, t0 + i * 0.13, 0.6));
    ctx.save(); ctx.globalAlpha *= a * (it.ph ? 0.45 : 1); if (opts.dir === 'y') ctx.translate(0, (1 - a) * 34); else ctx.translate((1 - a) * 40, 0); ctx.textBaseline = 'alphabetic';
    if (it.kind === 'rule') { ctx.fillStyle = it.col; ctx.fillRect(C ? x - it.w * a / 2 : x, y, it.w * a, it.h); }
    else if (it.kind === 'text') {
      if (l.single) { setFont(ctx, it.role, l.size, it.w, l.text); ctx.fillStyle = it.col; drawText(ctx, l.text, x, y + l.px * 0.92, AL, l.size * it.sp); }
      else drawRich(ctx, l.lay, it.role, it.w, it.wB || Math.max(it.w, 700), x, y + l.px * (it.base || 0.92), l.lh, AL, it.col, it.colB || it.col);
    } else if (it.kind === 'chip') {
      l.lay.lines.forEach((ln, j) => {
        const cy = y + j * (l.chipH + 6);
        const bx = C ? x - (ln.w + 30) / 2 : x;
        ctx.fillStyle = it.bg; rrect(ctx, bx, cy, ln.w + 30, l.chipH, 7); ctx.fill();
        ctx.fillStyle = it.edge || 'transparent'; ctx.fillRect(bx, cy, 4, l.chipH);
        drawRich(ctx, { size: l.lay.size, lines: [ln] }, it.role, it.w, it.w, C ? x + 2 : x + 15, cy + l.chipH / 2 + l.px * 0.34, l.lh, AL, it.col, it.col);
      });
    }
    ctx.restore();
    y += l.hh + (it.kind === 'gap' ? 0 : 12 * k);
  });
  return y;
}

function sigCard(ctx, p, s, cx, top, aw, t, t0, P, env, ph, al, k = 1.16, kind = 'rise', idx = 0) {

  ctx.restore();

/* =====================================================================
   BULK IMPORT — student lists from Excel / CSV / Word / PDF, and many
   photos at once (matched to names by file name).
   Excel & Word are read with a tiny built-in reader (no library needed).
   ===================================================================== */

/* ---------- minimal ZIP reader (xlsx and docx are zip files) ---------- */
async function unzip(buf) {
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error('This file looks damaged or is not an Office file.');
  const n = dv.getUint16(eocd + 10, true); let p = dv.getUint32(eocd + 16, true);
  const files = {};
  for (let k = 0; k < n; k++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), elen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true), lho = dv.getUint32(p + 42, true);
    files[new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nlen))] = { method, csize, lho };
    p += 46 + nlen + elen + clen;
  }
  return {
    names: Object.keys(files),
    async text(name) {
      const f = files[name]; if (!f) return null;
      const start = f.lho + 30 + dv.getUint16(f.lho + 26, true) + dv.getUint16(f.lho + 28, true);
      const data = u8.slice(start, start + f.csize);
      let out = data;
      if (f.method === 8) {
        if (typeof DecompressionStream === 'undefined') throw new Error('Please update your browser to read Excel/Word files (or paste the list instead).');
        out = new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
      }
      return new TextDecoder().decode(out);
    }
  };
}
const xmlDoc = s => new DOMParser().parseFromString(s, 'application/xml');
const colIndex = ref => { let n = 0; for (const ch of String(ref).replace(/\d+/g, '')) n = n * 26 + (ch.charCodeAt(0) - 64); return Math.max(0, n - 1); };

async function readXlsx(buf) {
  const z = await unzip(buf);
  const ss = [];
  const sst = await z.text('xl/sharedStrings.xml');
  if (sst) for (const si of xmlDoc(sst).getElementsByTagName('si')) ss.push([...si.getElementsByTagName('t')].map(t => t.textContent).join(''));
  let path = 'xl/worksheets/sheet1.xml';
  try {
    const wb = xmlDoc(await z.text('xl/workbook.xml')), rels = xmlDoc(await z.text('xl/_rels/workbook.xml.rels'));
    const first = wb.getElementsByTagName('sheet')[0];
    const rid = first.getAttribute('r:id') || first.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
    for (const r of rels.getElementsByTagName('Relationship')) if (r.getAttribute('Id') === rid) { const tg = r.getAttribute('Target'); path = tg.startsWith('/') ? tg.slice(1) : 'xl/' + tg.replace(/^\.\//, ''); }
  } catch (e) {}
  const xml = await z.text(path); if (!xml) throw new Error('No sheet found in this Excel file.');
  const rows = [];
  for (const row of xmlDoc(xml).getElementsByTagName('row')) {
    const arr = [];
    for (const c of row.getElementsByTagName('c')) {
      const t = c.getAttribute('t'), v = c.getElementsByTagName('v')[0];
      let val = '';
      if (t === 's') val = ss[+(v && v.textContent)] || '';
      else if (t === 'inlineStr') val = [...c.getElementsByTagName('t')].map(x => x.textContent).join('');
      else val = v ? v.textContent : '';
      arr[colIndex(c.getAttribute('r'))] = val;
    }
    rows.push(Array.from(arr, x => (x || '').trim()));
  }
  return rows;
}

async function readDocx(buf) {
  const z = await unzip(buf);
  const doc = xmlDoc(await z.text('word/document.xml'));
  const pText = p => { let s = ''; const walk = n => { for (const c of n.childNodes) { if (c.nodeName === 'w:t') s += c.textContent; else if (c.nodeName === 'w:tab') s += '\t'; else if (c.nodeName === 'w:br') s += ' '; else if (c.childNodes && c.childNodes.length) walk(c); } }; walk(p); return s; };
  const rows = [];
  for (const tbl of doc.getElementsByTagName('w:tbl'))
    for (const tr of tbl.getElementsByTagName('w:tr'))
      rows.push([...tr.getElementsByTagName('w:tc')].map(tc => [...tc.getElementsByTagName('w:p')].map(pText).join(' ').trim()));
  if (rows.filter(r => r.some(Boolean)).length >= 2) return rows;
  const lines = [...doc.getElementsByTagName('w:p')].map(pText);
  return textToRows(lines.join('\n'));
}

function readCsv(text) {
  const first = text.split(/\r?\n/)[0] || '';
  const delim = [',', ';', '\t'].sort((a, b) => first.split(b).length - first.split(a).length)[0];
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === delim) { row.push(cell.trim()); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell.trim()); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell || row.length) { row.push(cell.trim()); rows.push(row); }
  return rows;

/* PDF text, rebuilt into rows by position (pdf.js loads only when needed) */
const PDFJS_URL = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/legacy/build/pdf.min.mjs';

async function readPdf(buf) {
  let lib;
  try { lib = await import(PDFJS_URL); } catch (e) { throw new Error('Could not load the PDF reader (needs internet). You can copy the list from the PDF and use “Paste” instead.'); }
  lib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
  const pdf = await lib.getDocument({ data: new Uint8Array(buf), isEvalSupported: false }).promise;
  const rows = [];
  for (let pn = 1; pn <= Math.min(pdf.numPages, 20); pn++) {
    const page = await pdf.getPage(pn), tc = await page.getTextContent();
    const items = tc.items.filter(it => it.str && it.str.trim()).map(it => ({ s: it.str, x: it.transform[4], y: it.transform[5], w: it.width || 0, h: Math.abs(it.transform[3]) || 10 }));
    items.sort((a, b) => b.y - a.y || a.x - b.x);
    const lines = [];
    for (const it of items) { const ln = lines.find(l => Math.abs(l.y - it.y) < it.h * 0.5); if (ln) ln.items.push(it); else lines.push({ y: it.y, items: [it] }); }
    for (const ln of lines) {
      ln.items.sort((a, b) => a.x - b.x);
      const cells = []; let cur = '', lastEnd = null;
      for (const it of ln.items) {
        if (lastEnd != null && it.x - lastEnd > it.h * 1.2) { cells.push(cur.trim()); cur = ''; }
        else if (lastEnd != null && it.x - lastEnd > it.h * 0.15) cur += ' ';
        cur += it.s; lastEnd = it.x + it.w;
      }
      cells.push(cur.trim());
      rows.push(cells.length > 1 ? cells : textToRows(cells[0])[0] || cells);
    }

}

/* ---------- plain text lines → rows ---------- */
const RX_GRADE = /^(?:grade|gr\.?|class|தரம்)?\s*(\d{1,2})\s*([a-z])?$/i;
const RX_PLACE = /^(?:\d(?:st|nd|rd|th)\b.*|first|second|third|winner|champion.*|runners?[- ]?up|merit|special.*|.*place|முதல.*|இரண்டா.*|மூன்றா.*)$/i;
function textToRows(text) {
  return String(text).split(/\r?\n/).map(l => l.replace(/^\s*(?:\d{1,3}[.)]|[•●▪\-–])\s+/, '').trim()).filter(Boolean).map(l => {
    if (l.includes('\t')) return l.split('\t').map(x => x.trim()).filter(Boolean);
    if (/\s{3,}/.test(l)) return l.split(/\s{3,}/).map(x => x.trim());
    if (l.includes('|')) return l.split('|').map(x => x.trim()).filter(Boolean);
    if (/\s[-–—]\s/.test(l)) return l.split(/\s[-–—]\s/).map(x => x.trim());
    if (l.split(',').length >= 3) return l.split(',').map(x => x.trim());
    // single run of words: pull out grade and place
    let rest = ' ' + l + ' ', grade = '', place = '';
    rest = rest.replace(/\b(?:grade|gr\.?|class)\s*(\d{1,2}\s?[a-z]?)\b/i, (m, g) => { grade = g; return ' '; });
    rest = rest.replace(/\b(\d(?:st|nd|rd|th)(?:\s+place)?|first(?:\s+place)?|second(?:\s+place)?|third(?:\s+place)?|winner|runners?[- ]up|merit)\b/i, m => { place = m; return ' '; });
    return [rest.replace(/[,;]+/g, ' ').replace(/\s+/g, ' ').trim(), grade, place, ''];
  });
}

/* drop empty rows and titles above the table; start at the heading row if there is one */
function tidyRows(rows) {
  rows = rows.map(r => r.map(c => String(c || '').trim())).filter(r => r.some(Boolean));
  const kw = /^(name|student|grade|class|place|position|rank|result|event|competition|item|பெயர்|தரம்|இடம்)/i;
  const hi = rows.slice(0, 6).findIndex(r => r.filter(c => kw.test(c) && !/\d/.test(c)).length >= 2);
  if (hi > 0) rows = rows.slice(hi);
  const counts = rows.map(r => r.filter(Boolean).length).sort((a, b) => a - b);
  const typical = counts[Math.floor(counts.length / 2)] || 1;
  if (typical >= 3) rows = rows.filter(r => r.filter(Boolean).length >= Math.max(2, typical - 1));
  return rows;
}

/* ---------- guess which column is which ---------- */
const FIELDS = [{ k: 'name', label: 'Name' }, { k: 'grade', label: 'Grade' }, { k: 'place', label: 'Place / result' }, { k: 'event', label: 'Event' }, { k: '', label: '— ignore —' }];
function guessColumns(rows) {
  const width = Math.max(0, ...rows.map(r => r.length));
  const head = (rows[0] || []).map(c => String(c || '').toLowerCase());
  const kw = { name: /name|student|பெயர்/, grade: /grade|class|தரம்|yr|year/, place: /place|position|rank|result|award|இடம்/, event: /event|competition|item|category|subject|போட்டி|நிகழ்வு/ };
  const map = new Array(width).fill(''); let header = false;
  head.forEach((c, i) => { if (/\d/.test(c) || c.length > 28) return; for (const k in kw) if (kw[k].test(c) && !map.includes(k)) { map[i] = k; header = true; break; } });
  if (header) return { map, header };
  const body = rows.slice(0, 40);
  const score = (i, rx) => body.filter(r => r[i] && rx.test(String(r[i]).trim())).length / Math.max(1, body.filter(r => r[i]).length);
  const used = new Set();
  const pick = (k, rx) => { let best = -1, bs = 0.5; for (let i = 0; i < width; i++) { if (used.has(i)) continue; const s = score(i, rx); if (s > bs) { bs = s; best = i; } } if (best >= 0) { map[best] = k; used.add(best); } };
  pick('grade', RX_GRADE); pick('place', RX_PLACE);
  const textCols = [...Array(width).keys()].filter(i => !used.has(i) && body.some(r => r[i]));
  const avgLen = i => body.reduce((s, r) => s + String(r[i] || '').length, 0) / body.length;
  const nameLike = i => score(i, /^[A-Za-z஀-௿]([A-Za-z஀-௿.]*\.?\s?){1,6}$/);
  textCols.sort((a, b) => nameLike(b) - nameLike(a) || a - b);
  if (textCols[0] != null) { map[textCols[0]] = 'name'; used.add(textCols[0]); }
  if (textCols[1] != null) { map[textCols[1]] = 'event'; }

}
function placeKeyOf(v) {
  v = String(v || '').trim(); const l = v.toLowerCase(); if (!l) return ['', ''];
  const m = /^(\d)/.exec(l); if (m && +m[1] >= 1 && +m[1] <= 5) return [m[1], ''];
  if (/first|முதல/.test(l)) return ['1', '']; if (/second|இரண்டா/.test(l)) return ['2', '']; if (/third|மூன்றா/.test(l)) return ['3', ''];
  if (/winner|champ/.test(l)) return ['winner', '']; if (/runner/.test(l)) return ['runnerup', '']; if (/merit/.test(l)) return ['merit', '']; if (/special/.test(l)) return ['special', ''];
  return ['custom', v.toUpperCase()];
}

/* ---------- the import dialog ---------- */
async function importListDialog(p, redraw, MAX = 20) {
  const file = await pickFile('.xlsx,.csv,.txt,.docx,.pdf,text/csv,application/pdf,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.openxmlformats-officedocument.wordprocessingml.document');
  if (!file) return;
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  let rows;
  try {
    toast('Reading ' + file.name + '…', 1500);
    if (ext === 'xlsx') rows = await readXlsx(await file.arrayBuffer());
    else if (ext === 'docx') rows = await readDocx(await file.arrayBuffer());
    else if (ext === 'pdf') rows = await readPdf(await file.arrayBuffer());
    else if (ext === 'csv' || ext === 'txt') { const tx = await file.text(); rows = ext === 'csv' ? readCsv(tx) : textToRows(tx); }
    else if (ext === 'xls' || ext === 'doc') throw new Error('Old .' + ext + ' files can’t be read. Please “Save as” .' + ext + 'x (or CSV) and try again.');
    else throw new Error('Please choose an Excel (.xlsx), CSV, Word (.docx) or PDF file.');
  } catch (e) { return modal('Could not read the file', e.message || String(e)); }
  rows = tidyRows(rows);
  if (!rows.length) return modal('Nothing found', 'No rows of text were found in this file.');
  const width = Math.min(8, Math.max(...rows.map(r => r.length)));
  const g = guessColumns(rows);
  const st = { map: g.map.slice(0, width), header: g.header, replace: !p.students.some(s => s.name.trim() || s.photo) };
  const body = h('div');
  const draw = () => {
    body.innerHTML = '';
    body.appendChild(h('p', null, `Found ${rows.length - (st.header ? 1 : 0)} rows in “${file.name}”. Check that each column is labelled correctly, then press Add.`));
    const tbl = h('table', { class: 'imp' });
    tbl.appendChild(h('tr', null, [...Array(width).keys()].map(i => {
      const sel = h('select', { class: 'inp' }, FIELDS.map(f => h('option', { value: f.k }, f.label)));
      sel.value = st.map[i] || ''; sel.addEventListener('change', () => { st.map[i] = sel.value; }); return h('th', null, sel);
    })));
    rows.slice(st.header ? 1 : 0, (st.header ? 1 : 0) + 6).forEach(r => tbl.appendChild(h('tr', null, [...Array(width).keys()].map(i => h('td', null, r[i] || '')))));
    body.appendChild(h('div', { class: 'imp-wrap' }, tbl));
    const hc = h('input', { type: 'checkbox', checked: st.header }); hc.addEventListener('change', () => { st.header = hc.checked; draw(); });
    const rc = h('input', { type: 'checkbox', checked: st.replace }); rc.addEventListener('change', () => { st.replace = rc.checked; });
    body.append(h('label', { class: 'chk' }, hc, 'First row is a heading'), h('label', { class: 'chk' }, rc, 'Replace the current list'));
  };
  draw();
  const ok = await modal('Import student list', body, [{ label: 'Cancel', value: false }, { label: 'Add students', value: true, pri: true }]);
  if (!ok) return;
  const col = k => st.map.indexOf(k);
  const data = rows.slice(st.header ? 1 : 0).map(r => {
    const [pk, pc] = placeKeyOf(col('place') >= 0 ? r[col('place')] : '');
    return { ...newStudent(), name: col('name') >= 0 ? r[col('name')] || '' : '', grade: col('grade') >= 0 ? cleanGrade(r[col('grade')]) : '', place: pk, placeCustom: pc, event: col('event') >= 0 ? r[col('event')] || '' : '' };
  }).filter(s => s.name.trim());
  if (st.replace) p.students = [];
  else p.students = p.students.filter(s => s.name.trim() || s.photo);
  let added = 0;
  for (const s of data) { if (p.students.length >= MAX) break; p.students.push(s); added++; }
  changed(); redraw();
  toast(added + ' added' + (data.length > added ? ` (${MAX} maximum)` : ''), 3200);
}

/* ---------- many photos at once, matched to names ---------- */
const normName = s => String(s || '').toLowerCase().normalize('NFKD').replace(/[^a-z஀-௿]/g, '');
function nameSimilarity(a, b) {

/** Choose columns/rows and card size that fill the free area best.

/** draw a winners table. scroll = px scrolled; view = visible body height (null = all) */
function drawTable(ctx, rows, cols, box, rh, headH, pal, t, scroll, view, ta, mo, numOffset) {
  const tw = cols.reduce((s, c) => s + c.w, 0), xs = []; let x = box.x;
  cols.forEach(c => { const w = box.w * c.w / tw; xs.push({ ...c, x, w }); x += w; });
  const ha = EASE.inOut(prog(t, 1.2, 0.6));
  // header
  ctx.save(); ctx.globalAlpha *= clamp01(ha * 1.4);
  ctx.fillStyle = pal.head; rrect(ctx, box.x, box.y, box.w * ha, headH, 12); ctx.fill();
  ctx.fillStyle = pal.headInk;
  xs.forEach(c => { const sz = fitSize(ctx, c.lab, 'head', 600, c.w - 16, headH * 0.36, 8, 0.14), px = setFont(ctx, 'head', sz, 600, c.lab); drawText(ctx, c.lab, c.k === 'name' || c.k === 'event' ? c.x + 14 : c.x + c.w / 2, box.y + headH / 2 + px * 0.36, c.k === 'name' || c.k === 'event' ? 'left' : 'center', sz * 0.14); });
  ctx.restore();
  // body (clipped when scrolling)
  const by = box.y + headH, bodyH = view != null ? Math.min(view, rh * rows.length) : rh * rows.length;
  ctx.save(); ctx.beginPath(); ctx.rect(box.x - 60, by, box.w + 120, bodyH); ctx.clip();
  const visible = Math.ceil(bodyH / rh);
  rows.forEach((r, i) => {
    const ry = by + i * rh - (scroll || 0);
    if (ry > by + bodyH || ry + rh < by) return;
    // every row pops in on its own: first the ones on screen, then each one as it scrolls into view
    let a = i < visible ? prog(t, 1.6 + i * 0.28, 0.5) : (t === Infinity ? 1 : Math.min(prog(t, 1.6 + visible * 0.28, 0.5), clamp01((by + bodyH - ry) / (rh * 0.9))));
    if (a <= 0) return;
    const e = EASE.back(a), cyr = ry + rh / 2;
    ctx.save(); ctx.globalAlpha *= clamp01(a * 1.8) * (r._ph ? 0.45 : 1);
    if (mo.card === 'slide' || mo.card === 'swing') ctx.translate((1 - EASE.out(a)) * (i % 2 ? 90 : -90), 0);
    ctx.translate(box.x + box.w / 2, cyr); ctx.scale(0.6 + 0.4 * e, 0.6 + 0.4 * e); ctx.translate(-(box.x + box.w / 2), -cyr);
    ctx.fillStyle = i % 2 ? pal.rowB : pal.rowA; ctx.fillRect(box.x, ry, box.w, rh);
    ctx.fillStyle = pal.line; ctx.fillRect(box.x, ry + rh - 1, box.w, 1);
    if (a < 1) { ctx.save(); ctx.strokeStyle = `rgba(201,162,75,${(1 - a) * 0.95})`; ctx.lineWidth = 4; ctx.strokeRect(box.x + 2, ry + 2, box.w - 4, rh - 4); ctx.restore(); }
    const cy = ry + rh / 2, fs = Math.min(rh * 0.38, box.fsMax || 30);
    xs.forEach(c => {
      if (c.k === 'n') { const s = String(i + 1 + numOffset); setFont(ctx, 'head', fs * 0.9, 500, s); ctx.fillStyle = pal.soft; drawText(ctx, s, c.x + c.w / 2, cy + fs * 0.34, 'center'); }
      else if (c.k === 'name') { const s = UP(r.name.trim()), sz = fitSize(ctx, s, 'head', 600, c.w - 20, fs * 1.05, 7, 0.02); setFont(ctx, 'head', sz, 600, s); ctx.fillStyle = pal.acc; drawText(ctx, s, c.x + 14, cy + sz * 0.36, 'left', sz * 0.02); }
      else if (c.k === 'grade') { const s = cleanGrade(r.grade); if (s) { const sz = fitSize(ctx, s, 'head', 500, c.w - 12, fs, 7); setFont(ctx, 'head', sz, 500, s); ctx.fillStyle = pal.ink; drawText(ctx, s, c.x + c.w / 2, cy + sz * 0.36, 'center'); } }
      else if (c.k === 'event') { const s = (r.event || '').trim(); if (s) { const sz = fitSize(ctx, s, 'body', 500, c.w - 20, fs * 0.92, 7); setFont(ctx, 'body', sz, 500, s); ctx.fillStyle = pal.ink; drawText(ctx, s, c.x + 14, cy + sz * 0.36, 'left'); } }
      else if (c.k === 'place') {
        const pl = placeLabel(r.place, r.placeCustom, ta ? 'ta' : 'en'), md = placeOf(r.place).medal; if (!pl) return;
        const sz = Math.min(fs, fitSize(ctx, pl, 'head', 600, c.w - 40, fs, 7));
        if (md) { const mg = MEDAL_GRAD[md]; const g = ctx.createLinearGradient(c.x + 14, cy - 9, c.x + 32, cy + 9); g.addColorStop(0, mg[0]); g.addColorStop(1, mg[2]); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(c.x + 22, cy, Math.min(10, rh * 0.2), 0, Math.PI * 2); ctx.fill(); }
        drawPlace(ctx, pl, c.x + 38, cy + sz * 0.36, sz, pal.acc, 'left');
      }
    });
    ctx.restore();
  });
  ctx.restore();

    ctx.save(); const g = ctx.createLinearGradient(0, by + bodyH - 40, 0, by + bodyH); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.18)'); ctx.fillStyle = g; ctx.fillRect(box.x, by + bodyH - 40, box.w, 40); ctx.restore();
  }
}

/** draw one labelled photo. img = drawable, iw/ih = its size, scale = output scale */
function drawLabelled(img, iw, ih, text, o, scale, dateStr, descStr) {
  const w = Math.max(1, Math.round(iw * scale)), ph = Math.max(1, Math.round(ih * scale));
  const k1 = o.size || 1, k2 = o.size2 || 1;
  // what goes in the label: name (big) + description + date (smaller lines)
  let t1 = String(text || '').trim();
  const desc = String(descStr != null ? descStr : (o.line2 || '')).trim(), date = String(dateStr || '').trim();
  const details = [];
  if (desc) details.push({ t: desc, kind: 'desc' });
  if (date) details.push({ t: date, kind: 'date' });
  if (!t1 && details.length) t1 = details.shift().t;
  if (o.caps && t1 && !TAMIL.test(t1)) t1 = t1.toUpperCase();
  const nD = details.length;
  // bar grows with the chosen text sizes and the number of lines, so the label always fits
  const barH = Math.round(Math.min(ph * 0.36, Math.max(ph * 0.07, Math.min(w, ph) * (0.035 + 0.075 * k1 + 0.05 * k2 * nD))));
  const below = o.place === 'below' && o.style !== 'fade', H2 = below ? ph + barH : ph;
  const c = mkCanvas(w, H2), x = c.getContext('2d');
  x.imageSmoothingQuality = 'high';
  x.fillStyle = '#ffffff'; x.fillRect(0, 0, w, H2);
  x.drawImage(img, 0, 0, w, ph);
  const top = H2 - barH, line = Math.max(2, Math.round(barH * 0.035));
  const style = o.style, fade = style === 'fade', A = 1 - Math.min(0.9, Math.max(0, o.clear || 0));
  // bar / fade
  if (fade) {
    const fh = Math.min(H2, barH * 2.1), g = x.createLinearGradient(0, H2 - fh, 0, H2);
    g.addColorStop(0, 'rgba(60,0,0,0)'); g.addColorStop(0.45, 'rgba(80,0,0,.55)'); g.addColorStop(1, 'rgba(70,0,0,.92)');
    x.save(); x.globalAlpha = A; x.fillStyle = g; x.fillRect(0, H2 - fh, w, fh); x.restore();
  } else if (style === 'white') {
    x.save(); x.globalAlpha = A; x.fillStyle = '#ffffff'; x.fillRect(0, top, w, barH); x.restore();
    x.fillStyle = '#800000'; x.fillRect(0, top, w, line);
    x.fillStyle = '#C9A24A'; x.fillRect(0, H2 - line * 1.5, w, line * 1.5);
  } else {
    const g = x.createLinearGradient(0, top, w, H2); g.addColorStop(0, '#8E0B0B'); g.addColorStop(1, '#5A0000');
    x.save(); x.globalAlpha = A; x.fillStyle = g; x.fillRect(0, top, w, barH); x.restore();
    x.fillStyle = '#C9A24A'; x.fillRect(0, top, w, line);
  }
  const dark = style !== 'white';
  // logos
  const pad = barH * 0.16, lh = barH - pad * 2;
  let left = barH * 0.22, right = w - barH * 0.22;
  const crest = getImg(CREST_SRC);
  if (o.crest && crest && crest.naturalWidth) {
    const ch = lh * 0.92, cw = ch * crest.naturalWidth / crest.naturalHeight, cy = top + (barH - ch) / 2 + line / 2;
    if (dark) { x.fillStyle = '#ffffff'; x.beginPath(); x.ellipse(left + cw / 2, cy + ch / 2, cw / 2 + pad * 0.45, ch / 2 + pad * 0.35, 0, 0, Math.PI * 2); x.fill(); left += pad * 0.45; }
    x.drawImage(crest, left, cy, cw, ch); left += cw + pad * 1.4;
  }
  const media = dark ? mediaWhite() : getImg(MEDIA_SRC);
  if (o.media && media && (media.width || media.naturalWidth)) {
    const mw0 = media.naturalWidth || media.width, mh0 = media.naturalHeight || media.height;
    const mh = lh * 0.78, mw = mh * mw0 / mh0;
    x.drawImage(media, right - mw, top + (barH - mh) / 2 + line / 2, mw, mh); right -= mw + pad * 1.4;
  }
  // text block centred between the logos (or across the bar)
  const balance = Math.min(left, w - right), L = o.crest || o.media ? balance : barH * 0.3, R = o.crest || o.media ? w - balance : w - barH * 0.3;
  const maxW = Math.max(barH, R - L), cx = (L + R) / 2;
  const col1 = dark ? '#ffffff' : '#800000', col1b = dark ? '#F2DC9E' : '#5A0000', col2 = dark ? '#F2DC9E' : '#5f5a56';
  const inner = barH - line * 2, midY = top + line + inner / 2;
  if (!t1) return c;
  // share the bar height between the name and the detail lines (in the ratio of the chosen sizes)
  const u1 = 0.5 * k1, u2 = 0.27 * k2, tot = u1 * 1.08 + nD * u2 * 1.32;
  let s1 = inner * 0.86 * u1 / tot, s2 = inner * 0.86 * u2 / tot, lay1, p1, lh1, lays = [];
  for (let i = 0; i < 30; i++) {          // shrink until everything fits the width AND the height
    lay1 = fitRich(x, t1, 'head', 600, 700, maxW, 2, s1, s1 * 0.5); p1 = setFont(x, 'head', lay1.size, 600, t1); lh1 = p1 * 1.08;
    lays = details.map(d => { const iw2 = d.kind === 'date' ? s2 * 1.5 : 0, l = fitRich(x, d.t, 'body', 500, 700, maxW - iw2, d.kind === 'desc' ? 2 : 1, s2, s2 * 0.6); return { d, l, px: setFont(x, 'body', l.size, 500, d.t) }; });
    const need = lay1.lines.length * lh1 + lays.reduce((t, q) => t + q.l.lines.length * q.px * 1.3 + q.px * 0.04, 0);
    if (need <= inner * 0.9) break;
    s1 *= 0.93; s2 *= 0.93;
  }
  const blockH = lay1.lines.length * lh1 + lays.reduce((t, q) => t + q.l.lines.length * q.px * 1.3 + q.px * 0.04, 0);
  let y = midY - blockH / 2;
  x.textBaseline = 'alphabetic';
  if (fade || (A < 0.75 && dark)) { x.shadowColor = 'rgba(0,0,0,.55)'; x.shadowBlur = p1 * 0.25; }
  if (A < 0.75 && !dark) { x.shadowColor = 'rgba(255,255,255,.9)'; x.shadowBlur = p1 * 0.3; }
  drawRich(x, lay1, 'head', 600, 700, cx, y + p1 * 0.86, lh1, 'center', col1, col1b);
  y += lay1.lines.length * lh1;
  for (const q of lays) {
    const base = y + q.px * 1.08;
    setFont(x, 'body', q.l.size, 500, q.d.t);
    if (q.d.kind === 'date') {           // small calendar icon before the date
      const tw = q.l.lines[0] ? q.l.lines[0].w : 0, ic = q.px * 0.95, gap = q.px * 0.45;
      const startX = cx - (tw + ic + gap) / 2;
      infoIcon(x, 'date', startX + ic / 2, base - q.px * 0.33, ic, col2);
      setFont(x, 'body', q.l.size, 500, q.d.t);
      drawRich(x, q.l, 'body', 500, 700, startX + ic + gap, base, q.px * 1.3, 'left', col2, col1);
    } else drawRich(x, q.l, 'body', 500, 700, cx, base, q.px * 1.3, 'center', col2, col1);
    y += q.l.lines.length * q.px * 1.3 + q.px * 0.04;
  }
  x.shadowColor = 'transparent';
  return c;
}

/* ---------- export: one file, or a ZIP of many ---------- */
async function labRender(p, o) {
  const { im, url } = await loadFileImage(p.file);
  try {
    let sc = 1; const cap = o.max || 0;
    if (cap && Math.max(p.w, p.h) > cap) sc = cap / Math.max(p.w, p.h);
    if (p.w * p.h * sc * sc > 16e6) sc = Math.sqrt(16e6 / (p.w * p.h));   // phone browser canvas limit
    const c = drawLabelled(im, p.w, p.h, p.label, o, sc, labDateOf(p, o), labDescOf(p, o));
    return await new Promise(r => c.toBlob(r, o.fmt === 'png' ? 'image/png' : 'image/jpeg', 0.92));
  } finally { URL.revokeObjectURL(url); }
}

/* ---------- tiny ZIP writer (stored, no compression — photos are already compressed) ---------- */
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

    ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true); ch.setUint32(42, off, true);

}

function labClearField(o, set) {
  const val = h('b', { style: { color: 'var(--m)', minWidth: '44px', textAlign: 'right' } }, Math.round((o.clear || 0) * 100) + '%');
  const r = h('input', { type: 'range', class: 'range', min: 0, max: 0.9, step: 0.05, value: o.clear || 0 });
  r.addEventListener('input', () => {
    const v = +r.value; val.textContent = Math.round(v * 100) + '%';
    if (v > 0 && o.place === 'below' && o.style !== 'fade') {
      o.place = 'over'; document.querySelectorAll('.lab .seg button').forEach(b => { if (b.textContent === 'Over the bottom') b.click(); });
      toast('Moved the label over the photo so the photo shows through', 2600);
    }
    set('clear', v);
  });
  return fld('Background transparency', h('div', { style: { display: 'flex', alignItems: 'center', gap: '12px' } }, r, val), '0% = solid colour. Higher = more of the photo shows through behind the label (text and logos stay solid).');
}

function labSizeField(label, o, key, set) {
  const val = h('b', { style: { color: 'var(--m)', minWidth: '48px', textAlign: 'right' } }, Math.round((o[key] || 1) * 100) + '%');
  const r = h('input', { type: 'range', class: 'range', min: 0.5, max: 1.8, step: 0.05, value: o[key] || 1 });
  r.addEventListener('input', () => { val.textContent = Math.round(+r.value * 100) + '%'; set(key, +r.value); });
  const reset = h('button', { class: 'btn out sm', type: 'button', onclick: () => { r.value = 1; val.textContent = '100%'; set(key, 1); } }, 'Reset');
  return fld(label, h('div', { style: { display: 'flex', alignItems: 'center', gap: '12px' } }, h('span', { style: { fontSize: '12px', color: 'var(--ash)' } }, 'A'), r, h('span', { style: { fontSize: '19px', color: 'var(--ash)', fontWeight: 600 } }, 'A'), val, reset), 'The label grows to fit bigger text. Very long names still shrink so they never get cut off.');
}

/* ---------- large preview: see each labelled photo big, flip through, fix names ---------- */
function labPreview(start, onClose) {
  const o = labOpts();
  let i = Math.max(0, Math.min(start, LAB.photos.length - 1)), orig = false, cache = { id: null, im: null, url: null }, busy = 0;
  const cv = h('canvas', { class: 'lb-cv' }), info = h('span', { class: 'lb-info' }), spin = h('div', { class: 'lb-spin' });
  const name = h('input', { class: 'inp', placeholder: 'Name / caption' }), desc = h('input', { class: 'inp', placeholder: 'Own description (optional)' });
  const origBtn = h('button', { class: 'btn out sm lb-orig', type: 'button' }, 'Show original');
  const render = async () => {
    const p = LAB.photos[i]; if (!p) return close();
    const my = ++busy;
    info.textContent = `${i + 1} / ${LAB.photos.length}  ·  ${p.w}×${p.h}${o.dateMode === 'photo' && p.shot ? '  ·  taken ' + labFmtDate(p.shot, o.dateFmt) : ''}`;
    if (document.activeElement !== name) name.value = p.label; if (document.activeElement !== desc) desc.value = p.desc || '';
    desc.placeholder = (o.line2 || '').trim() ? 'Description: ' + o.line2 : 'Description (optional)';
    // quick draw from the thumbnail, then the sharp version from the full photo
    const paint = (src, sw, sh) => {
      const max = Math.min(1800, Math.max(window.innerWidth, window.innerHeight) * Math.min(2, window.devicePixelRatio || 1)), sc = Math.min(1, max / Math.max(sw, sh));
      const out = orig ? (() => { const c = mkCanvas(Math.round(sw * sc), Math.round(sh * sc)); c.getContext('2d').drawImage(src, 0, 0, c.width, c.height); return c; })()
        : drawLabelled(src, sw, sh, p.label, o, sc, labDateOf(p, o), labDescOf(p, o));
      cv.width = out.width; cv.height = out.height; cv.getContext('2d').drawImage(out, 0, 0);
    };
    if (cache.id !== p.id) { paint(p.thumb, p.thumb.width, p.thumb.height); spin.hidden = false;
      try { if (cache.url) URL.revokeObjectURL(cache.url); const r = await loadFileImage(p.file); if (my !== busy) { URL.revokeObjectURL(r.url); return; } cache = { id: p.id, im: r.im, url: r.url }; } catch (e) { spin.hidden = true; return; } }
    spin.hidden = true;
    // full-size image keeps the proportions of the original, so draw it at the photo's own size
    paint(cache.im, p.w, p.h);
  };
  let tmr = 0; const soon = () => { clearTimeout(tmr); tmr = setTimeout(render, 140); };
  name.addEventListener('input', () => { LAB.photos[i].label = name.value; soon(); });
  desc.addEventListener('input', () => { LAB.photos[i].desc = desc.value; soon(); });
  const go = d => { if (LAB.photos.length < 2) return; i = (i + d + LAB.photos.length) % LAB.photos.length; orig = false; origBtn.textContent = 'Show original'; name.blur(); desc.blur(); render(); };
  origBtn.addEventListener('click', () => { orig = !orig; origBtn.textContent = orig ? 'Show label' : 'Show original'; render(); });
  const key = e => { if (e.target === name || e.target === desc) { if (e.key === 'Enter') e.target.blur(); return; } if (e.key === 'ArrowRight') go(1); else if (e.key === 'ArrowLeft') go(-1); else if (e.key === 'Escape') close(); };
  const close = () => { document.removeEventListener('keydown', key); if (cache.url) URL.revokeObjectURL(cache.url); ov.remove(); document.body.style.overflow = ''; if (onClose) onClose(); };
  const stage = h('div', { class: 'lb-stage' }, cv, spin,
    h('button', { class: 'lb-nav prev', type: 'button', 'aria-label': 'Previous', onclick: () => go(-1) }, svg(ICON.back)),
    h('button', { class: 'lb-nav next', type: 'button', 'aria-label': 'Next', onclick: () => go(1) }, svg(ICON.back)));
  let sx = null; stage.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener('touchend', e => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1); sx = null; });
  const ov = h('div', { class: 'lb', role: 'dialog', 'aria-label': 'Photo preview' },
    h('div', { class: 'lb-top' }, info, h('button', { class: 'lb-x', type: 'button', 'aria-label': 'Close', onclick: close }, '×')),
    stage,
    h('div', { class: 'lb-bottom' },
      h('div', { class: 'lb-fields' }, name, desc),
      h('div', { class: 'lb-acts' }, origBtn,
        h('button', { class: 'btn out sm', type: 'button', onclick: () => { const p = LAB.photos[i]; LAB.photos.splice(i, 1); if (!LAB.photos.length) return close(); if (i >= LAB.photos.length) i = 0; cache.id = null; render(); } }, svg(ICON.trash), 'Remove'),
        h('button', { class: 'btn pri sm', type: 'button', onclick: () => labExport([LAB.photos[i]]) }, svg(ICON.down), 'Download this'))));
  document.body.appendChild(ov); document.body.style.overflow = 'hidden';
  document.addEventListener('keydown', key);
  render();
}

$('#draftsBtn').addEventListener('click', showDrafts);

if (document.fonts) {
  const want = ['400 40px "Bebas Neue"', '600 40px Oswald', '700 40px Oswald', '400 20px Poppins', '600 20px Poppins', '700 20px Poppins', '800 40px "Anek Tamil"', '600 40px "Anek Tamil"', '400 20px "Mukta Malar"', '600 20px "Mukta Malar"'];
  Promise.all(want.map(f => document.fonts.load(f, 'Aa தமிழ்').catch(() => {}))).then(() => { requestRender(); });
  document.fonts.ready.then(requestRender);
}

/* =====================================================================
   PHASE 5 — phone app (install + offline), share, teacher review
   ===================================================================== */
const IS_TOUCH = matchMedia('(pointer:coarse)').matches;
const IS_IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const IS_STANDALONE = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
function canShareFile(file) { try { return !!(navigator.canShare && navigator.canShare({ files: [file] })); } catch (e) { return false; } }

/* ---------- after a download on a phone: offer the share sheet (WhatsApp, Facebook, Save to Photos) ---------- */
async function offerShare(blob, filename) {
  if (!IS_TOUCH) return;
  const file = new File([blob], filename, { type: blob.type });
  if (!canShareFile(file)) return;
  const v = await modal('Saved ✓', 'Share it straight to WhatsApp or Facebook, or choose “Save image / Save video” to put it in your gallery.', [{ label: 'Done', value: false }, { label: 'Share…', value: true, pri: true }]);
  if (v) { try { await navigator.share({ files: [file] }); } catch (e) { if (e.name !== 'AbortError') toast('Sharing is not available here — the file is in your Downloads.'); } }
}

/* ---------- teacher review: send the poster + caption to a teacher on WhatsApp ---------- */
function reviewText(p) {
  const tpl = TEMPLATES[p.template];
  return `📝 Review request – Baduriya Media Unit\n\nPost: ${String(tpl.label(p)).replace(/\*\*/g, '')} (${tpl.title})\n\nPlease check:\n• Names and spellings\n• Results, marks and places\n• Date, time and venue\n• Tamil wording\n\nReply with ✅ if it is fine, or tell us what to change.\n\n— Caption that will be posted —\n${tpl.caption(p)}`;
}
function reviewSection() {
  return h('div', { class: 'fld', style: { marginTop: '16px' } },
    h('label', null, 'Teacher review (before posting)'),
    h('div', { class: 'help', style: { marginBottom: '8px' } }, 'Sends the poster and caption to a teacher on WhatsApp so they can check names, results and Tamil wording.'),
    h('button', { class: 'btn out block', type: 'button', onclick: sendForReview }, svg(ICON.eye), 'Send for teacher review'));
}
async function sendForReview() {
  const p = APP.project, tpl = TEMPLATES[p.template];
  toast('Preparing the poster…', 1400);
  await (document.fonts ? document.fonts.ready : Promise.resolve());
  const c = renderPoster(p, 1, APP.format);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.9));
  if (!blob) return toast('Could not create the image');
  const name = `review-${p.template}-${slug(tpl.label(p))}.jpg`, file = new File([blob], name, { type: 'image/jpeg' });
  const text = reviewText(p), num = String(SETTINGS.reviewNumber || '').replace(/\D/g, '');
  const share = canShareFile(file);
  const body = h('div', null,
    h('p', null, share ? 'Tap “Share to WhatsApp” and choose the teacher. The poster and this message go together.' : 'The poster will download first. Then WhatsApp opens with this message — attach the downloaded poster and send.'),
    h('div', { class: 'review-box' }, text));
  const v = await modal('Send for teacher review', body, [{ label: 'Cancel', value: false }, { label: 'Copy message', value: 'copy' }, { label: share ? 'Share to WhatsApp' : 'Download & open WhatsApp', value: 'go', pri: true }]);
  if (v === 'copy') { try { await navigator.clipboard.writeText(text); toast('Message copied'); } catch (e) { toast('Could not copy'); } return; }
  if (v !== 'go') return;
  if (share) {
    try { await navigator.share({ files: [file], text }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = h('a', { href: URL.createObjectURL(blob), download: name, style: { display: 'none' } });
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
  const url = (num ? `https://wa.me/${num}` : 'https://wa.me/') + '?text=' + encodeURIComponent(text);
  const w = window.open(url, '_blank', 'noopener');
  if (!w) { try { await navigator.clipboard.writeText(text); } catch (e) {} toast('Poster downloaded. Open WhatsApp and paste the message (copied).', 4500); }
}

/* ---------- install as a phone / desktop app ---------- */
(function installSetup() {
  if (!window.BMP_HOSTED || IS_STANDALONE) return;
  const btn = $('#installBtn'); if (!btn) return;
  let deferred = null;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; btn.hidden = false; });
  window.addEventListener('appinstalled', () => { btn.hidden = true; deferred = null; toast('Installed ✓ — open “Baduriya Media” from your home screen'); });
  if (IS_IOS) btn.hidden = false;
  btn.addEventListener('click', async () => {
    if (deferred) { deferred.prompt(); try { await deferred.userChoice; } catch (e) {} deferred = null; btn.hidden = true; return; }
    modal('Install on iPhone / iPad', h('div', null, h('p', null, 'Open this page in Safari, then:'),
      h('ol', { class: 'steps-ios' }, h('li', null, 'Tap the Share button (square with an arrow).'), h('li', null, 'Scroll and tap “Add to Home Screen”.'), h('li', null, 'Tap “Add”.')),
      h('p', { class: 'help' }, 'The portal then opens like an app and works without internet.')));
  });
})();

/* ---------- offline / online notice ---------- */
(function netNotice() {
  let pill = null;
  const upd = () => {
    if (!navigator.onLine) { if (!pill) { pill = h('div', { class: 'offline-pill' }, 'Offline — you can still make posters and videos'); document.body.appendChild(pill); } }
    else if (pill) { pill.remove(); pill = null; }
  };
  window.addEventListener('online', upd); window.addEventListener('offline', upd); upd();
})();
